<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KD Search</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
        }

        header {
            background: white;
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        .container {
            max-width: 650px;
            margin: 25px auto;
            padding: 15px;
        }

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .search-row {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .search-button {
            padding: 13px 18px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .results {
            margin-top: 20px;
        }

        .result {
            background: white;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .result strong {
            display: block;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .type {
            color: #777;
            font-size: 13px;
        }

        .empty {
            text-align: center;
            color: #666;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>KD</h1>
    <p>Search KD</p>
</header>

<div class="container">

    <div class="search-box">
        <h2>🔍 Search</h2>

        <div class="search-row">
            <input
                id="searchInput"
                type="text"
                placeholder="Search people, posts, groups..."
                onkeydown="handleEnter(event)"
            >

            <button class="search-button" onclick="searchKD()">
                Search
            </button>
        </div>

        <div class="results" id="results">
            <div class="empty">
                Type something to search KD.
            </div>
        </div>
    </div>

</div>

<script>
const kdData = [
    {
        name: "KD User",
        type: "Person",
        description: "KD social app user"
    },
    {
        name: "KD Creator",
        type: "Creator",
        description: "Video and content creator"
    },
    {
        name: "KD Community",
        type: "Group",
        description: "Community for KD users"
    },
    {
        name: "Welcome to KD",
        type: "Post",
        description: "Your social world starts here"
    }
];

function searchKD() {
    const query = document.getElementById("searchInput").value
        .trim()
        .toLowerCase();

    const results = document.getElementById("results");

    if (query === "") {
        results.innerHTML =
            '<div class="empty">Please enter something to search.</div>';
        return;
    }

    const matches = kdData.filter(function (item) {
        return (
            item.name.toLowerCase().includes(query) ||
            item.type.toLowerCase().includes(query) ||
            item.description.toLowerCase().includes(query)
        );
    });

    if (matches.length === 0) {
        results.innerHTML =
            '<div class="empty">No results found.</div>';
        return;
    }

    results.innerHTML = "";

    matches.forEach(function (item) {
        const result = document.createElement("div");
        result.className = "result";

        const title = document.createElement("strong");
        title.textContent = item.name;

        const type = document.createElement("div");
        type.className = "type";
        type.textContent = item.type;

        const description = document.createElement("div");
        description.textContent = item.description;

        result.appendChild(title);
        result.appendChild(type);
        result.appendChild(description);

        results.appendChild(result);
    });
}

function handleEnter(event) {
    if (event.key === "Enter") {
        searchKD();
    }
}
</script>

</body>
</html>
