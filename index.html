<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KD Settings</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
        }

        header {
            background: white;
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        .container {
            max-width: 650px;
            margin: 25px auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 18px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .setting {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .setting:last-child {
            border-bottom: none;
        }

        .setting-text strong {
            display: block;
            margin-bottom: 5px;
        }

        .setting-text span {
            color: #666;
            font-size: 14px;
        }

        .switch {
            width: 52px;
            height: 28px;
            background: #ccc;
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
        }

        .switch::after {
            content: "";
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: 0.2s;
        }

        .switch.active {
            background: #222;
        }

        .switch.active::after {
            left: 27px;
        }

        .danger {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 9px;
            background: #eeeeee;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>KD</h1>
    <p>Settings & Privacy</p>
</header>

<div class="container">

    <div class="card">
        <h2>🔐 Privacy</h2>

        <div class="setting">
            <div class="setting-text">
                <strong>Private Account</strong>
                <span>Only approved people can follow you.</span>
            </div>
            <div class="switch" onclick="toggleSetting(this)"></div>
        </div>

        <div class="setting">
            <div class="setting-text">
                <strong>Show Online Status</strong>
                <span>Let others see when you are online.</span>
            </div>
            <div class="switch active" onclick="toggleSetting(this)"></div>
        </div>

        <div class="setting">
            <div class="setting-text">
                <strong>Allow Messages</strong>
                <span>Allow other users to send you messages.</span>
            </div>
            <div class="switch active" onclick="toggleSetting(this)"></div>
        </div>
    </div>

    <div class="card">
        <h2>🔔 Notifications</h2>

        <div class="setting">
            <div class="setting-text">
                <strong>Push Notifications</strong>
                <span>Receive notifications from KD.</span>
            </div>
            <div class="switch active" onclick="toggleSetting(this)"></div>
        </div>
    </div>

    <div class="card">
        <h2>🛡️ Safety</h2>

        <button class="danger" onclick="reportHelp()">
            Report a Problem
        </button>

        <button class="danger" onclick="blockedUsers()">
            Blocked Users
        </button>
    </div>

</div>

<script>
function toggleSetting(element) {
    element.classList.toggle("active");
}

function reportHelp() {
    alert("KD Help Center will be connected later.");
}

function blockedUsers() {
    alert("Blocked Users management will be added later.");
}
</script>

</body>
</html>
