<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KD Profile</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
        }

        header {
            background: white;
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        .profile {
            max-width: 600px;
            margin: 25px auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .profile-top {
            text-align: center;
        }

        .avatar {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #dddddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        .username {
            font-size: 25px;
            font-weight: bold;
        }

        .bio {
            color: #666;
            margin-top: 8px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-top: 25px;
        }

        .stats strong {
            display: block;
            font-size: 22px;
        }

        .stats span {
            color: #666;
        }

        .edit-btn {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .post {
            padding: 18px;
            border-radius: 10px;
            background: #f7f7f7;
            margin-top: 12px;
        }
    </style>
</head>

<body>

<header>
    <h1>KD</h1>
</header>

<div class="profile">

    <div class="card profile-top">

        <div class="avatar">
            👤
        </div>

        <div class="username">
            KD User
        </div>

        <div class="bio">
            Welcome to my KD profile!
        </div>

        <div class="stats">
            <div>
                <strong>0</strong>
                <span>Posts</span>
            </div>

            <div>
                <strong>0</strong>
                <span>Followers</span>
            </div>

            <div>
                <strong>0</strong>
                <span>Following</span>
            </div>
        </div>

        <button class="edit-btn" onclick="alert('Edit Profile coming next!')">
            Edit Profile
        </button>

    </div>

    <div class="card">
        <h2>My Posts</h2>

        <div class="post">
            <strong>My First KD Post</strong>
            <p>Welcome to KD Social App! 🎉</p>
        </div>

    </div>

</div>

</body>
</html>
