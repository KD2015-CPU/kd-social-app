<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KD Social App</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
        }

        header {
            background: white;
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        .container {
            max-width: 450px;
            margin: 35px auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn {
            background: #222;
            color: white;
        }

        .signup-btn {
            background: #eeeeee;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>KD</h1>
    <p>Connect • Share • Discover</p>
</header>

<div class="container">

    <div class="card">
        <h2>Login to KD</h2>

        <input type="text" id="username" placeholder="Username or Email">

        <input type="password" id="password" placeholder="Password">

        <button class="login-btn" onclick="login()">
            Login
        </button>

        <button class="signup-btn" onclick="signup()">
            Create New Account
        </button>

        <div id="message"></div>
    </div>

</div>

<script>
function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    if (username === "" || password === "") {
        message.textContent = "Please enter your username and password.";
        return;
    }

    message.textContent = "Demo login successful! Welcome to KD 🎉";
}

function signup() {
    const message = document.getElementById("message");
    message.textContent = "KD account creation will be added next.";
}
</script>

</body>
</html>
