<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KD Social App</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
        }

        header {
            background: #ffffff;
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            margin: 5px 0 0;
            color: #666;
        }

        .container {
            max-width: 600px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .welcome {
            text-align: center;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .menu button {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            background: #eeeeee;
        }

        .post h3 {
            margin-top: 0;
        }

        .post button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>KD</h1>
    <p>Connect • Share • Discover</p>
</header>

<div class="container">

    <div class="card welcome">
        <h2>Welcome to KD</h2>
        <p>Your social world starts here.</p>
    </div>

    <div class="card">
        <h2>KD Menu</h2>

        <div class="menu">
            <button>🏠 Home</button>
            <button>👤 Profile</button>
            <button>➕ Create Post</button>
            <button>🔍 Search</button>
            <button>💬 Messages</button>
            <button>🔔 Notifications</button>
        </div>
    </div>

    <div class="card post">
        <h3>My First KD Post</h3>
        <p>Welcome to the KD Social App! 🎉</p>
        <button onclick="alert('Liked! ❤️')">❤️ Like</button>
    </div>

</div>

</body>
</html>
