<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KD Create Post</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
        }

        header {
            background: white;
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        .container {
            max-width: 600px;
            margin: 25px auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .post {
            background: #f7f7f7;
            padding: 18px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .post-name {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .post-time {
            font-size: 12px;
            color: #777;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>KD</h1>
    <p>Create and share</p>
</header>

<div class="container">

    <div class="card">
        <h2>Create Post</h2>

        <textarea id="postText" placeholder="What's on your mind?"></textarea>

        <button onclick="createPost()">Publish Post</button>
    </div>

    <div class="card">
        <h2>My Posts</h2>

        <div id="posts">
            <p id="emptyMessage">No posts yet.</p>
        </div>
    </div>

</div>

<script>
function createPost() {
    const text = document.getElementById("postText").value.trim();

    if (text === "") {
        alert("Please write something first.");
        return;
    }

    const posts = document.getElementById("posts");

    const emptyMessage = document.getElementById("emptyMessage");
    if (emptyMessage) {
        emptyMessage.remove();
    }

    const post = document.createElement("div");
    post.className = "post";

    post.innerHTML = `
        <div class="post-name">KD User</div>
        <div>${escapeHTML(text)}</div>
        <div class="post-time">Just now</div>
    `;

    posts.prepend(post);

    document.getElementById("postText").value = "";
}

function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}
</script>

</body>
</html>
