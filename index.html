<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KD Media Upload</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            color: #222;
        }

        header {
            background: white;
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
        }

        header p {
            margin: 6px 0 0;
            color: #666;
        }

        .container {
            max-width: 650px;
            margin: 25px auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        textarea {
            width: 100%;
            min-height: 110px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
        }

        .upload-label {
            display: block;
            margin-top: 15px;
            padding: 14px;
            text-align: center;
            background: #eeeeee;
            border-radius: 10px;
            cursor: pointer;
        }

        #mediaInput {
            display: none;
        }

        .button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .preview {
            margin-top: 15px;
            text-align: center;
        }

        .preview img,
        .preview video {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            border-radius: 12px;
            background: #000;
        }

        .remove-button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #eeeeee;
            cursor: pointer;
        }

        .post {
            margin-top: 15px;
            padding: 16px;
            border-radius: 12px;
            background: #f8f8f8;
        }

        .post-user {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .post img,
        .post video {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            border-radius: 10px;
            margin-top: 12px;
            background: #000;
        }

        .empty {
            text-align: center;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>KD</h1>
    <p>Photo & Video Upload</p>
</header>

<div class="container">

    <div class="card">
        <h2>➕ Create Media Post</h2>

        <textarea
            id="postText"
            placeholder="What's on your mind?"
        ></textarea>

        <label class="upload-label" for="mediaInput">
            📷 Choose Photo or Video
        </label>

        <input
            id="mediaInput"
            type="file"
            accept="image/*,video/*"
            onchange="previewMedia(event)"
        >

        <div id="preview" class="preview"></div>

        <button class="button" onclick="publishPost()">
            Publish Post
        </button>
    </div>

    <div class="card">
        <h2>📰 KD Feed</h2>

        <div id="feed">
            <p class="empty">No posts yet.</p>
        </div>
    </div>

</div>

<script>
    let selectedFile = null;

    function previewMedia(event) {
        const file = event.target.files[0];
        const preview = document.getElementById("preview");

        preview.innerHTML = "";
        selectedFile = null;

        if (!file) {
            return;
        }

        selectedFile = file;

        const url = URL.createObjectURL(file);

        if (file.type.startsWith("image/")) {
            const image = document.createElement("img");
            image.src = url;
            image.alt = "Selected photo";
            preview.appendChild(image);
        } else if (file.type.startsWith("video/")) {
            const video = document.createElement("video");
            video.src = url;
            video.controls = true;
            preview.appendChild(video);
        }

        const removeButton = document.createElement("button");
        removeButton.className = "remove-button";
        removeButton.textContent = "Remove Media";
        removeButton.onclick = removeMedia;

        preview.appendChild(removeButton);
    }

    function removeMedia() {
        selectedFile = null;

        document.getElementById("mediaInput").value = "";
        document.getElementById("preview").innerHTML = "";
    }

    function publishPost() {
        const text = document.getElementById("postText").value.trim();
        const feed = document.getElementById("feed");

        if (text === "" && !selectedFile) {
            alert("Please write something or choose a photo/video.");
            return;
        }

        const empty = feed.querySelector(".empty");

        if (empty) {
            empty.remove();
        }

        const post = document.createElement("div");
        post.className = "post";

        const username = document.createElement("div");
        username.className = "post-user";
        username.textContent = "KD User";

        post.appendChild(username);

        if (text !== "") {
            const postText = document.createElement("p");
            postText.textContent = text;
            post.appendChild(postText);
        }

        if (selectedFile) {
            const url = URL.createObjectURL(selectedFile);

            if (selectedFile.type.startsWith("image/")) {
                const image = document.createElement("img");
                image.src = url;
                image.alt = "KD post photo";
                post.appendChild(image);
            }

            if (selectedFile.type.startsWith("video/")) {
                const video = document.createElement("video");
                video.src = url;
                video.controls = true;
                post.appendChild(video);
            }
        }

        feed.prepend(post);

        document.getElementById("postText").value = "";
        removeMedia();

        alert("Post published successfully! 🎉");
    }
</script>

</body>
</html>
