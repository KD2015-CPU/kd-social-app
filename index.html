<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KD Notifications</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
        }

        header {
            background: white;
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        .container {
            max-width: 650px;
            margin: 25px auto;
            padding: 15px;
        }

        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .title {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .notification {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .notification:last-child {
            border-bottom: none;
        }

        .icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #eeeeee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .notification-text {
            flex: 1;
        }

        .notification-text strong {
            display: block;
            margin-bottom: 4px;
        }

        .time {
            font-size: 12px;
            color: #777;
        }

        .unread {
            background: #f7f7f7;
        }

        .clear-btn {
            width: calc(100% - 30px);
            margin: 15px;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>KD</h1>
    <p>Notifications</p>
</header>

<div class="container">

    <div class="card" id="notificationList">

        <div class="title">
            <h2>🔔 Notifications</h2>
        </div>

        <div class="notification unread">
            <div class="icon">❤️</div>
            <div class="notification-text">
                <strong>KD User liked your post</strong>
                <span class="time">2 minutes ago</span>
            </div>
        </div>

        <div class="notification unread">
            <div class="icon">💬</div>
            <div class="notification-text">
                <strong>KD Creator commented on your post</strong>
                <span class="time">10 minutes ago</span>
            </div>
        </div>

        <div class="notification">
            <div class="icon">👤</div>
            <div class="notification-text">
                <strong>KD User started following you</strong>
                <span class="time">1 hour ago</span>
            </div>
        </div>

        <div class="notification">
            <div class="icon">💬</div>
            <div class="notification-text">
                <strong>You received a new message</strong>
                <span class="time">2 hours ago</span>
            </div>
        </div>

        <button class="clear-btn" onclick="clearNotifications()">
            Mark All as Read
        </button>

    </div>

</div>

<script>
function clearNotifications() {
    const notifications = document.querySelectorAll(".notification");

    notifications.forEach(function (notification) {
        notification.classList.remove("unread");
    });

    alert("All notifications marked as read.");
}
</script>

</body>
</html>
