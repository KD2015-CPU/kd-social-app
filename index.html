<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KD Social App - Media Post</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
        }

        header {
            background: white;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-size: 34px;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 10px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
        }

        .file-label {
            display: block;
            margin-top: 15px;
            padding: 14px;
            text-align: center;
            background: #eeeeee;
            border-radius: 10px;
            cursor: pointer;
        }

        #mediaInput {
            display: none;
        }

        #preview {
            margin-top: 15px;
        }

        #preview img,
        #preview video {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 12px;
            background: #000;
        }

        .publish-btn {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .post {
            background: #f8f8f8;
            padding: 18px;
            border-radius: 12px;
            margin-top: 15px;
        }

        .post-user {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .post img,
        .post video {
            width: 100%;
            margin-top: 12px;
            border-radius: 10px;
            max-height: 450px;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>

<body>

<header>
    <h1>KD</h1>
    <p>Share your moments</p>
</header>

<div class="container">

    <div class="card">
        <h2>Create Post</h2>

        <textarea id="postText" placeholder="What's on your mind?"></textarea>

        <label class="file-label" for="mediaInput">
            📷 Choose Photo or Video
        </label>

        <input
            id="mediaInput"
            type="file"
            accept="image/*,video/*"
            onchange="previewMedia(event)"
        >

        <div id="preview"></div>

        <button class="publish-btn" onclick="publishPost()">
            Publish Post
        </button>
    </div>

    <div class="card">
        <h2>KD Feed</h2>
        <div id="feed">
            <p>No posts yet.</p>
        </div>
    </div>

</div>

<script>
let selectedFile = null;
let previewURL = null;

function previewMedia(event) {
    const file = event.target.files[0];
    const preview = document.getElementById("preview");

    preview.innerHTML = "";
    selectedFile = file;

    if (!file) {
        return;
    }

    if (previewURL) {
        URL.revokeObjectURL(previewURL);
    }

    previewURL = URL.createObjectURL(file);

    if (file.type.startsWith("image/")) {
        const img = document.createElement("img");
        img.src = previewURL;
        img.alt = "Selected photo";
        preview.appendChild(img);
    } else if (file.type.startsWith("video/")) {
        const video = document.createElement("video");
        video.src = previewURL;
        video.controls = true;
        preview.appendChild(video);
    } else {
        preview.textContent = "Unsupported file type.";
    }
}

function publishPost() {
    const text = document.getElementById("postText").value.trim();
    const feed = document.getElementById("feed");

    if (text === "" && !selectedFile) {
        alert("Please write something or choose a photo/video.");
        return;
    }

    const emptyMessage = feed.querySelector("p");
    if (emptyMessage && emptyMessage.textContent === "No posts yet.") {
        emptyMessage.remove();
    }

    const post = document.createElement("div");
    post.className = "post";

    const user = document.createElement("div");
    user.className = "post-user";
    user.textContent = "KD User";
    post.appendChild(user);

    if (text !== "") {
        const textElement = document.createElement("p");
        textElement.textContent = text;
        post.appendChild(textElement);
    }

    if (selectedFile) {
        const mediaURL = URL.createObjectURL(selectedFile);

        if (selectedFile.type.startsWith("image/")) {
            const img = document.createElement("img");
            img.src = mediaURL;
            img.alt = "KD post photo";
            post.appendChild(img);
        } else if (selectedFile.type.startsWith("video/")) {
            const video = document.createElement("video");
            video.src = mediaURL;
            video.controls = true;
            post.appendChild(video);
        }
    }

    feed.prepend(post);

    document.getElementById("postText").value = "";
    document.getElementById("mediaInput").value = "";
    document.getElementById("preview").innerHTML = "";
    selectedFile = null;

    if (previewURL) {
        URL.revokeObjectURL(previewURL);
        previewURL = null;
    }
}
</script>

</body>
</html>
