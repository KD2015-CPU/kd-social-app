<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KD Chat</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
        }

        header {
            background: white;
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        .chat-container {
            max-width: 650px;
            margin: 20px auto;
            padding: 15px;
        }

        .chat-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .chat-header {
            padding: 18px;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
            font-size: 18px;
        }

        .messages {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f8f8;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            margin-bottom: 12px;
            border-radius: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .received {
            background: white;
            margin-right: auto;
        }

        .sent {
            background: #222;
            color: white;
            margin-left: auto;
        }

        .time {
            display: block;
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }

        .input-area {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: white;
            border-top: 1px solid #ddd;
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        .input-area button {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>KD</h1>
    <p>Messages</p>
</header>

<div class="chat-container">

    <div class="chat-card">

        <div class="chat-header">
            💬 Chat with KD User
        </div>

        <div class="messages" id="messages">

            <div class="message received">
                Hello! Welcome to KD 👋
                <span class="time">Just now</span>
            </div>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Write a message..."
                onkeydown="handleEnter(event)"
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

</div>

<script>
function sendMessage() {
    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");

    const text = input.value.trim();

    if (text === "") {
        return;
    }

    const message = document.createElement("div");
    message.className = "message sent";

    const messageText = document.createTextNode(text);
    message.appendChild(messageText);

    const time = document.createElement("span");
    time.className = "time";
    time.textContent = "Just now";

    message.appendChild(time);
    messages.appendChild(message);

    input.value = "";
    messages.scrollTop = messages.scrollHeight;
}

function handleEnter(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
}
</script>

</body>
</html>
