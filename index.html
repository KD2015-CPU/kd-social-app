<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KD Stories</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
        }

        header {
            background: white;
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        .container {
            max-width: 650px;
            margin: 25px auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .stories {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 10px 0;
        }

        .story {
            min-width: 85px;
            text-align: center;
            cursor: pointer;
        }

        .story-circle {
            width: 70px;
            height: 70px;
            margin: auto;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            overflow: hidden;
        }

        .story-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .story-name {
            margin-top: 7px;
            font-size: 13px;
        }

        .upload-label {
            display: block;
            padding: 14px;
            background: #eeeeee;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
        }

        #storyInput {
            display: none;
        }

        #preview {
            margin-top: 15px;
            text-align: center;
        }

        #preview img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #viewer {
            display: none;
            text-align: center;
        }

        #viewer img {
            max-width: 100%;
            max-height: 500px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<header>
    <h1>KD</h1>
    <p>Stories</p>
</header>

<div class="container">

    <div class="card">
        <h2>KD Stories</h2>

        <div class="stories">

            <div class="story" onclick="openStory()">
                <div class="story-circle" id="myStoryCircle">
                    ➕
                </div>
                <div class="story-name">Your Story</div>
            </div>

            <div class="story">
                <div class="story-circle">👤</div>
                <div class="story-name">KD User</div>
            </div>

            <div class="story">
                <div class="story-circle">👤</div>
                <div class="story-name">Creator</div>
            </div>

        </div>
    </div>

    <div class="card">
        <h2>Add Your Story</h2>

        <label class="upload-label" for="storyInput">
            📷 Choose Photo
        </label>

        <input
            id="storyInput"
            type="file"
            accept="image/*"
            onchange="previewStory(event)"
        >

        <div id="preview"></div>

        <button onclick="publishStory()">
            Publish Story
        </button>
    </div>

    <div class="card" id="viewer">
        <h2>Your Story</h2>
        <img id="storyImage" src="" alt="Your KD Story">
    </div>

</div>

<script>
let selectedStory = null;

function previewStory(event) {
    const file = event.target.files[0];

    if (!file) {
        return;
    }

    selectedStory = file;

    const url = URL.createObjectURL(file);

    document.getElementById("preview").innerHTML =
        '<img src="' + url + '" alt="Story preview">';
}

function publishStory() {
    if (!selectedStory) {
        alert("Please choose a photo first.");
        return;
    }

    const url = URL.createObjectURL(selectedStory);

    document.getElementById("myStoryCircle").innerHTML =
        '<img src="' + url + '" alt="My Story">';

    document.getElementById("storyImage").src = url;
    document.getElementById("viewer").style.display = "block";

    alert("Your KD Story has been added!");
}

function openStory() {
    if (!selectedStory) {
        alert("Add a story first.");
        return;
    }

    document.getElementById("viewer").style.display = "block";
}
</script>

</body>
</html>
