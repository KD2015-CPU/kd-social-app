<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KD Social App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>KD</h1>
        <p>Connect • Share • Discover</p>
    </header>

    <main>

        <div class="welcome-card">
            <h2>Welcome to KD</h2>
            <p>Your social world starts here.</p>

            <button onclick="document.getElementById('home').style.display='block'; this.style.display='none';">
                Start KD
            </button>
        </div>

        <div id="home" style="display:none;">

            <div class="post-card">
                <h3>My First Post</h3>
                <p>Welcome to my KD social app! 🎉</p>
                <button onclick="alert('You liked this post! ❤️')">
                    ❤️ Like
                </button>
            </div>

            <div class="post-card">
                <h3>KD Community</h3>
                <p>Connect with friends and share your moments.</p>
                <button onclick="alert('Coming soon!')">
                    Explore KD
                </button>
            </div>

        </div>

    </main>

</body>
</html>
