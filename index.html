<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KD Social App</title>

    <meta name="description" content="KD Social App - Connect, Share, Discover">
    <meta name="theme-color" content="#1565c0">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TOP BAR -->
    <header class="top-bar">
        <div class="logo">KD</div>

        <div class="app-name">
            <strong>KD</strong>
            <span>Social App</span>
        </div>

        <button class="search-btn" onclick="openSearch()">🔍</button>
    </header>


    <!-- STORIES -->
    <section class="stories-section">

        <h2>Stories</h2>

        <div class="stories">

            <div class="story add-story">
                <div class="story-circle">＋</div>
                <span>Your Story</span>
            </div>

            <div class="story">
                <div class="story-circle">👤</div>
                <span>Friends</span>
            </div>

            <div class="story">
                <div class="story-circle">🌟</div>
                <span>Star</span>
            </div>

            <div class="story">
                <div class="story-circle">🎵</div>
                <span>Music</span>
            </div>

            <div class="story">
                <div class="story-circle">🌍</div>
                <span>Travel</span>
            </div>

        </div>

    </section>


    <!-- CREATE POST -->
    <section class="create-post">

        <div class="profile-icon">K</div>

        <button onclick="createPost()">
            What's happening on KD?
        </button>

    </section>


    <!-- POST -->
    <main id="feed">

        <article class="post">

            <div class="post-header">

                <div class="profile-icon blue">K</div>

                <div>
                    <strong>Krishnadev</strong>
                    <small>Just now · 🌍</small>
                </div>

            </div>

            <p class="post-text">
                Welcome to <strong>KD Social App!</strong> 🎉
                Connect, share and discover something new.
            </p>

            <div class="post-image">
                <span>KD</span>
            </div>

            <div class="post-actions">

                <button onclick="likePost(this)">
                    ❤️ <span>0</span>
                </button>

                <button onclick="commentPost()">
                    💬 Comment
                </button>

                <button onclick="sharePost()">
                    ↗️ Share
                </button>

            </div>

        </article>

    </main>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">

        <button class="active" onclick="showMessage('Home')">
            🏠
            <span>Home</span>
        </button>

        <button onclick="showMessage('Search')">
            🔍
            <span>Search</span>
        </button>

        <button onclick="createPost()">
            ➕
            <span>Create</span>
        </button>

        <button onclick="showMessage('Notifications')">
            🔔
            <span>Alerts</span>
        </button>

        <button onclick="showMessage('Profile')">
            👤
            <span>Profile</span>
        </button>

    </nav>


    <!-- JAVASCRIPT -->
    <script>

        function likePost(button) {

            const count = button.querySelector("span");

            let likes = Number(count.textContent);

            likes++;

            count.textContent = likes;

        }


        function commentPost() {

            alert("Comments feature is coming soon!");

        }


        function sharePost() {

            alert("Share feature is coming soon!");

        }


        function createPost() {

            alert("Create Post feature is coming soon!");

        }


        function openSearch() {

            alert("KD Search is coming soon!");

        }


        function showMessage(page) {

            alert(page + " section is coming soon!");

        }

    </script>

</body>
</html>
