<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KD Social App - Feed</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
        }

        header {
            background: white;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
        }

        header h1 {
            margin: 0;
            font-size: 34px;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 10px;
        }

        .post {
            background: white;
            margin-bottom: 20px;
            padding: 18px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .user {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 12px;
        }

        .post-text {
            font-size: 17px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #eeeeee;
            cursor: pointer;
            font-size: 15px;
        }

        .actions button:hover {
            background: #dddddd;
        }

        .comments {
            margin-top: 15px;
            display: none;
        }

        .comments input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .comments button {
            margin-top: 8px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .comment-list {
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>KD</h1>
    <div>Home Feed</div>
</header>

<div class="container">

    <div class="post">
        <div class="user">KD User</div>

        <div class="post-text">
            Welcome to KD Social App! 🎉
        </div>

        <div class="actions">
            <button onclick="likePost(this)">❤️ Like</button>
            <button onclick="toggleComments(this)">💬 Comment</button>
            <button onclick="sharePost()">↗️ Share</button>
        </div>

        <div class="comments">
            <input type="text" placeholder="Write a comment...">
            <button onclick="addComment(this)">Post Comment</button>
            <div class="comment-list"></div>
        </div>
    </div>


    <div class="post">
        <div class="user">KD Creator</div>

        <div class="post-text">
            This is the second post on KD. 🚀
        </div>

        <div class="actions">
            <button onclick="likePost(this)">❤️ Like</button>
            <button onclick="toggleComments(this)">💬 Comment</button>
            <button onclick="sharePost()">↗️ Share</button>
        </div>

        <div class="comments">
            <input type="text" placeholder="Write a comment...">
            <button onclick="addComment(this)">Post Comment</button>
            <div class="comment-list"></div>
        </div>
    </div>

</div>

<script>
function likePost(button) {
    if (button.textContent === "❤️ Like") {
        button.textContent = "❤️ Liked";
    } else {
        button.textContent = "❤️ Like";
    }
}

function toggleComments(button) {
    const post = button.closest(".post");
    const comments = post.querySelector(".comments");

    if (comments.style.display === "block") {
        comments.style.display = "none";
    } else {
        comments.style.display = "block";
    }
}

function addComment(button) {
    const comments = button.parentElement;
    const input = comments.querySelector("input");
    const list = comments.querySelector(".comment-list");

    const text = input.value.trim();

    if (text === "") {
        alert("Please write a comment.");
        return;
    }

    const comment = document.createElement("p");
    comment.textContent = "KD User: " + text;

    list.appendChild(comment);

    input.value = "";
}

function sharePost() {
    alert("Share feature will be connected to real sharing later.");
}
</script>

</body>
</html>
