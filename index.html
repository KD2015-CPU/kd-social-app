<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KD Creator Studio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            color: #222;
        }

        header {
            background: white;
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        .container {
            max-width: 850px;
            margin: 25px auto;
            padding: 15px;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat {
            background: white;
            padding: 20px 10px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .stat strong {
            display: block;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .stat span {
            color: #666;
            font-size: 13px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            padding: 13px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 15px;
        }

        .primary {
            background: #222;
            color: white;
        }

        .item {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item strong {
            display: block;
            margin-bottom: 5px;
        }

        .item span {
            color: #666;
            font-size: 14px;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>KD Creator Studio</h1>
    <p>Create • Manage • Analyze</p>
</header>

<div class="container">

    <div class="welcome">
        <h2>Welcome, KD Creator 🎬</h2>
        <p>Manage your KD content from one place.</p>
    </div>

    <div class="stats">

        <div class="stat">
            <strong id="views">1,250</strong>
            <span>Views</span>
        </div>

        <div class="stat">
            <strong id="likes">320</strong>
            <span>Likes</span>
        </div>

        <div class="stat">
            <strong id="followers">85</strong>
            <span>Followers</span>
        </div>

        <div class="stat">
            <strong id="posts">12</strong>
            <span>Posts</span>
        </div>

    </div>

    <div class="card">
        <h2>⚡ Quick Actions</h2>

        <div class="actions">

            <button class="primary" onclick="uploadVideo()">
                🎥 Upload Video
            </button>

            <button onclick="createPost()">
                ➕ Create Post
            </button>

            <button onclick="viewAnalytics()">
                📊 View Analytics
            </button>

            <button onclick="manageContent()">
                🗂️ Manage Content
            </button>

        </div>

        <div id="message"></div>
    </div>

    <div class="card">
        <h2>📹 Recent Content</h2>

        <div class="item">
            <strong>My First KD Short</strong>
            <span>1,000 views • 250 likes</span>
        </div>

        <div class="item">
            <strong>Welcome to KD</strong>
            <span>200 views • 50 likes</span>
        </div>

        <div class="item">
            <strong>My New Video</strong>
            <span>50 views • 20 likes</span>
        </div>

    </div>

</div>

<script>

function showMessage(text) {
    document.getElementById("message").textContent = text;
}

function uploadVideo() {
    showMessage("Video upload system will be connected to KD Storage later.");
}

function createPost() {
    showMessage("Post creator opened.");
}

function viewAnalytics() {
    showMessage("Detailed KD analytics will be connected later.");
}

function manageContent() {
    showMessage("Content management will be added here.");
}

</script>

</body>
</html>
